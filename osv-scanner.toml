# OSV-Scanner configuration (`mise run security`; REQ-ENG-018).
# Every ignore needs a reason and an expiry (`ignoreUntil`) so it is
# re-reviewed instead of living forever. Prefer upgrading or a package.json
# `overrides` entry over an ignore; everything fixable that way already is.
# Triaged 2026-10-08: the remaining findings are dev-tooling dependencies that
# never ship in the app bundle, plus mermaid's nested katex (see its entry).
# Overrides never force a version outside a dependent's declared semver range.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-08
reason = "braces 3.0.3 stack exhaustion on deeply nested patterns; no fixed release exists (no fixed version in OSV). Dev-only: reached through micromatch -> fast-glob from @release-it/bumper, which only expands globs we write. Never shipped in the app."

[[IgnoredVulns]]
id = "GHSA-3v7f-55p6-f55p"
ignoreUntil = 2027-01-08
reason = "picomatch 2.3.1 glob matching issues (extglob ReDoS, POSIX class method injection). Dev-only: pinned ^2.3.1 by micromatch 4.0.8 (fast-glob, @release-it/bumper); a flat override to 2.3.2 is not possible because other packages need picomatch 4.x. Patterns come from our own release config. Never shipped in the app. Re-check when @release-it/bumper moves off fast-glob."

