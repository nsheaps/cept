reason = "basic-ftp 5.3.1 quadratic Client.list() parsing; fixed only in 6.2.1, outside get-uri 8.0.1's ^5.3.1 range. Dev-only: get-uri is in the release tooling's proxy-agent chain and never opens FTP connections. Never shipped in the app. Re-check when get-uri accepts basic-ftp 6."
