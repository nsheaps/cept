ignoreUntil = 2027-01-08
reason = "katex 0.16.47 nested under mermaid (mermaid 11.17.2 and the latest 12.1.0 both require ^0.16.47); the fix is only in 0.18.2+, and forcing 0.18 on mermaid is outside its declared range and untested. Exploiting it needs a pre-existing prototype pollution elsewhere in the page. Cept's own katex dependency is 0.18.7 and not affected. Re-check when mermaid accepts katex 0.18."

