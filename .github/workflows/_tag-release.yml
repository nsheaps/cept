name: Tag Release

on:
  workflow_call:
    inputs:
      screenshots-changed:
        description: "Whether screenshots have pixel-level changes to commit"
        type: boolean
        default: false
    secrets:
      AUTOMATION_GITHUB_APP_ID:
        required: true
      AUTOMATION_GITHUB_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write

jobs:
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate as GitHub App
        id: auth
        uses: nsheaps/github-actions/.github/actions/github-app-auth@1e129396b6f0b39257efac9a255010fe64a68ef8 # main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Download updated screenshots
        if: inputs.screenshots-changed
        uses: actions/download-artifact@v8
        with:
          name: updated-screenshots
          path: docs/screenshots/

      - name: Commit updated screenshots
        if: inputs.screenshots-changed
        run: scripts/ci/commit-screenshots.sh

      - name: Configure git
        run: scripts/ci/set-upstream.sh main main

      - name: Determine version bump
        id: version
        run: scripts/ci/tag-release-version.sh

      - name: Tag release
        if: steps.version.outputs.skip != 'true'
        run: mise run release:ci -- --verbose
        env:
          GITHUB_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Push screenshot updates (no release needed)
        if: steps.version.outputs.skip == 'true' && inputs.screenshots-changed
        run: git push origin main
        env:
          GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
