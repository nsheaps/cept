name: Update Screenshots

on:
  workflow_call:
    outputs:
      changed:
        description: 'Whether any screenshots had pixel-level changes'
        value: ${{ jobs.screenshots.outputs.changed }}

jobs:
  screenshots:
    name: Capture Screenshots
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Resolve Playwright version
        id: pw
        # Single source of truth: the installed @playwright/test, so the browser
        # cache key and image can't drift from the runtime when Renovate bumps it.
        run: mise run -q ci:playwright-version >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v${{ steps.pw.outputs.version }}-noble

      - name: Provision Playwright browsers from official image
        if: steps.pw-cache.outputs.cache-hit != 'true'
        # Copies browsers from Playwright's official image instead of its CDN, which
        # stalls intermittently from CI (see scripts/ci/provision-playwright.sh).
        run: mise run ci:playwright-provision
        env:
          PLAYWRIGHT_VERSION: ${{ steps.pw.outputs.version }}

      - name: Install Playwright system dependencies
        # apt-only (no browser download); installs the few libs the runner lacks.
        run: mise run ci:playwright-deps

      - name: Capture screenshots
        run: mise run screenshots:capture

      - name: Compare screenshots pixel-by-pixel
        id: compare
        run: mise run screenshots:compare

      - name: Upload changed screenshots
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: updated-screenshots
          path: docs/screenshots/
          retention-days: 5

      - name: Upload screenshots for review
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: feature-screenshots
          path: docs/screenshots/
          retention-days: 30
