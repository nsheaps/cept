name: CD

on:
  # Use 'create' instead of 'push: tags' because the release commit
  # contains [skip ci] which would suppress push-triggered workflows.
  # The 'create' event is not affected by [skip ci].
  create:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  github-release:
    name: Create GitHub Release
    # Only run for version tags (filter out branch creation and non-version tags)
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        run: scripts/ci/extract-changelog.sh

      - name: Create release (from changelog)
        if: steps.changelog.outputs.auto != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md

      - name: Create release (auto-generated notes)
        if: steps.changelog.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  deploy-web:
    name: Deploy Web
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate as GitHub App
        id: auth
        uses: nsheaps/github-actions/.github/actions/github-app-auth@1e129396b6f0b39257efac9a255010fe64a68ef8 # main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Build web
        run: mise run build
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /cept/app/
          COMMIT_SHA: ${{ github.sha }}

      - name: Deploy to GitHub Pages
        run: scripts/ci/deploy-prod-pages.sh

  build-macos:
    name: Build macOS
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run install
      - run: mise run build

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: cept-macos
          path: packages/desktop/dist/*.dmg
          if-no-files-found: warn

  build-windows:
    name: Build Windows
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run install
      - run: mise run build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: cept-windows
          path: packages/desktop/dist/*.exe
          if-no-files-found: warn

  build-linux:
    name: Build Linux
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run install
      - run: mise run build

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: cept-linux
          path: packages/desktop/dist/*.AppImage
          if-no-files-found: warn

  build-ios:
    name: Build iOS
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run install
      - run: mise run build

      - name: Sync Capacitor iOS
        run: scripts/ci/cap-sync.sh ios
        continue-on-error: true

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: cept-ios
          path: packages/mobile/ios/
          if-no-files-found: warn

  build-android:
    name: Build Android
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 17

      - run: mise run install
      - run: mise run build

      - name: Sync Capacitor Android
        run: scripts/ci/cap-sync.sh android
        continue-on-error: true

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: cept-android
          path: packages/mobile/android/app/build/outputs/
          if-no-files-found: warn

  upload-release-assets:
    name: Upload Release Assets
    needs: [github-release, build-macos, build-windows, build-linux, build-ios, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/upload-release-assets.sh
