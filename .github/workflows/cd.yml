name: CD

on:
  # Use 'create' instead of 'push: tags' because the release commit
  # contains [skip ci] which would suppress push-triggered workflows.
  # The 'create' event is not affected by [skip ci].
  create:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  github-release:
    name: Create GitHub Release
    # Only run for version tags (filter out branch creation and non-version tags)
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        run: scripts/ci/extract-changelog.sh

      - name: Create release (from changelog)
        if: steps.changelog.outputs.auto != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md

      - name: Create release (auto-generated notes)
        if: steps.changelog.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  deploy-web:
    name: Deploy Web
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate as GitHub App
        id: auth
        uses: nsheaps/github-actions/.github/actions/github-app-auth@1e129396b6f0b39257efac9a255010fe64a68ef8 # main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Build web
        run: mise run build
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /cept/app/
          COMMIT_SHA: ${{ github.sha }}

      - name: Deploy to GitHub Pages
        run: scripts/ci/deploy-prod-pages.sh

  # Native packaging is not built yet. These jobs stand in for it so a release
  # says so instead of reporting success for artifacts nobody built: desktop
  # packages land in plan PRs 78 and 79, mobile packages later (D-43).
  desktop-packages:
    name: Desktop packages (not built yet)
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Report that desktop packages are not built
        run: echo "::warning title=No desktop packages::desktop packaging (macOS, Windows, Linux) lands in PRs 78 and 79; this release has no desktop assets"

  mobile-packages:
    name: Mobile packages (not built yet)
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Report that mobile packages are not built
        run: echo "::warning title=No mobile packages::iOS and Android packaging is deferred past Phase 1 (D-43); this release has no mobile assets"
