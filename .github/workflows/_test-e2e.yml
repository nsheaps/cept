name: E2E Tests

on:
  workflow_call:

jobs:
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Resolve Playwright version
        id: pw
        # Single source of truth: the installed @playwright/test, so the browser
        # cache key and image can't drift from the runtime when Renovate bumps it.
        run: mise run -q ci:playwright-version >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v${{ steps.pw.outputs.version }}-noble

      - name: Provision Playwright browsers from official image
        if: steps.pw-cache.outputs.cache-hit != 'true'
        # Copies browsers from Playwright's official image instead of its CDN, which
        # stalls intermittently from CI (see scripts/ci/provision-playwright.sh).
        run: mise run ci:playwright-provision
        env:
          PLAYWRIGHT_VERSION: ${{ steps.pw.outputs.version }}

      - name: Install Playwright system dependencies
        # apt-only (no browser download); installs the few libs the runner lacks.
        run: mise run ci:playwright-deps

      - name: Run E2E tests
        run: mise run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
