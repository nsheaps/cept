# Every tool is pinned to an exact version; `mise run check:pins` enforces it.
# Bun must match the version that writes bun.lock.
[tools]
bun = "1.4.2"
node = "24.21.0"
gitleaks = "8.30.1"
osv-scanner = "2.6.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"

# Nx-backed tasks set NX_DAEMON=false: `check` runs them in parallel, and the
# Nx daemon races on its project graph then.
#
# Tasks wrap the root package.json scripts, which stay the inner commands.
# CI calls these tasks so a contributor can reproduce any job locally.
[tasks.install]
description = "Install dependencies from the lockfile"
run = "bun install --frozen-lockfile"

[tasks."check:pins"]
description = "Fail if any mise tool is not pinned to an exact version"
run = "bun scripts/ci/check-pins.ts .mise.toml"

[tasks."lint:workflows"]
description = "actionlint (with shellcheck), shellcheck on scripts/ci, and no multi-command run steps"
run = [
  "actionlint",
  "shellcheck scripts/ci/*.sh",
  "bun scripts/ci/no-inline-logic.ts .github/workflows",
]

[tasks."lint:format"]
description = "Fail if any file is not Prettier-formatted (fix with `mise run format`)"
run = "bunx prettier --check ."

[tasks.lint]
description = "Lint every project (affected ones when NX_BASE is set), the workflows and formatting"
depends = ["lint:workflows", "lint:format", "check:targets"]
run = "bun scripts/ci/nx-targets.ts lint"
env = { NX_DAEMON = "false" }

[tasks."check:targets"]
description = "Fail when an Nx project lacks build, typecheck or test:unit and records no skip reason"
run = "bun scripts/ci/check-targets.ts"
env = { NX_DAEMON = "false" }

[tasks.format]
description = "Apply Prettier formatting"
run = "bunx prettier --write ."

[tasks.typecheck]
description = "Typecheck every project (affected ones when NX_BASE is set)"
run = "bun scripts/ci/nx-targets.ts typecheck"
env = { NX_DAEMON = "false" }

[tasks."test:unit"]
description = "Run unit tests (affected projects when NX_BASE is set)"
run = "bun scripts/ci/nx-targets.ts test:unit"
env = { NX_DAEMON = "false" }

[tasks."test:integration"]
description = "Run integration tests (affected projects when NX_BASE is set)"
run = "bun scripts/ci/nx-targets.ts test:integration"
env = { NX_DAEMON = "false" }

[tasks."test:e2e"]
description = "Run Playwright end-to-end tests (skipped when NX_BASE is set and e2e is not affected)"
run = "bun scripts/ci/nx-targets.ts test:e2e"

[tasks.build]
description = "Build every project (affected ones when NX_BASE is set)"
run = "bun scripts/ci/nx-targets.ts build"
env = { NX_DAEMON = "false" }

[tasks."build:web"]
description = "Build only the web app (the PR preview; honours VITE_* env)"
run = "bunx vite build"
dir = "packages/web"

[tasks."release:ci"]
description = "Cut a release with release-it (CI mode); pass flags after --"
run = "bunx release-it --ci"

[tasks."ci:version-check"]
description = "Write the PR release-version outputs to $GITHUB_OUTPUT"
run = "bun scripts/ci/version-check.ts"

[tasks."ci:pr-title"]
description = "Check that PR_TITLE is a Conventional Commit using a .release-it.json type"
run = "bun scripts/ci/pr-title.ts"

[tasks."ci:playwright-version"]
description = "Print version=<installed Playwright version> for $GITHUB_OUTPUT"
run = "bun scripts/ci/playwright-version.ts"

[tasks."ci:affected"]
description = "Print affected=true|false for the project named after --, for $GITHUB_OUTPUT (true without NX_BASE)"
run = "bun scripts/ci/nx-affected.ts"

[tasks."ci:playwright-provision"]
description = "Copy Playwright browsers out of the official image (needs PLAYWRIGHT_VERSION)"
run = "scripts/ci/provision-playwright.sh"

[tasks."ci:playwright-deps"]
description = "Install the system libraries Chromium needs (apt only, no download)"
run = "bunx playwright install-deps chromium"

[tasks."screenshots:capture"]
description = "Regenerate the feature screenshots in docs/screenshots/features"
run = [
  "mkdir -p {{config_root}}/docs/screenshots/features",
  "bunx playwright test tests/feature-screenshots.spec.ts",
]
dir = "e2e"
env = { CI = "true" }

[tasks."screenshots:compare"]
description = "Restore pixel-identical screenshots and report changed=true|false"
run = "scripts/ci/compare-screenshots.sh"

[tasks.security]
description = "Secret scan (gitleaks: history and working tree) and dependency vulnerabilities (osv-scanner on bun.lock)"
run = [
  "gitleaks git --config .gitleaks.toml --no-banner --redact --log-opts=HEAD .",
  "gitleaks dir --config .gitleaks.toml --no-banner --redact .",
  "osv-scanner scan source --config osv-scanner.toml --lockfile bun.lock",
]

[tasks.check]
description = "The full local gate: pins, lint, typecheck, unit and integration tests, build, security"
depends = ["check:pins", "lint", "typecheck", "test:unit", "test:integration", "build", "security"]
